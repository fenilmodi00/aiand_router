changelog: 'v0.83 = v0.82, full-roster routing with cost sensitivity. Local v0.82
  had mean alpha 0.512, giving the cost term 48.8% of the blend against upstream v0.75''s
  9.0%. Combined with min-max cost normalisation on a 20x price ladder, that collapsed
  routing onto two flash lanes: glm-5.3, glm-5.3-flash and kimi-k3 won 0/16 clusters
  at every alpha from 0 to 1. v0.83 restores upstream''s quality-dominant alpha semantics
  and re-derives quality_means from measured ground-truth accuracy on the 9 labelled
  clusters, rescaled into each cluster''s existing range. output_cost_ratio 0.0 ->
  0.25 (upstream quality_pareto) widens the effective cost ladder to 25.3x by counting
  measured verbosity. Per cluster, alpha stays 0.96 where the measured winner leads
  by more than 2pt and drops to 0.80 where the top models are a statistical tie, so
  a tie resolves to the cheaper lane while a real capability margin keeps the premium
  model. centroids.bin, model_axes.json and model_registry.json BYTE-IDENTICAL to
  v0.82.'

