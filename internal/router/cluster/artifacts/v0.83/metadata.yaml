changelog: 'v0.83 = v0.82 with two coordinated changes. (1) default_routing_knobs.alpha
  restored toward the upstream quality-dominant semantics: local v0.82 dropped mean
  alpha to 0.512, giving the cost term 48.8% of the blend against upstream v0.75''s
  9.0%, which is what collapsed routing onto the two cheapest flash lanes. (2) quality_means
  re-derived from measured ground-truth labels for the 7 clusters that carry full
  8-model label coverage, min-max rescaled into each cluster''s existing cell range
  so alpha geometry is preserved; the other 9 clusters keep v0.82 cells byte-identical.
  centroids.bin, model_axes.json and model_registry.json BYTE-IDENTICAL to v0.82.
  Candidate; artifacts/latest NOT bumped.'
