changelog: 'v0.82 = v0.80 with coding-first quality cells (ticket #85 / C4; scripts/build_v082_coding.py).
  Bundle policy: per cluster, the knowledge cell is replaced by the coding-only shrunk mean (per-prompt
  z-score over the C2 coding labels, shrinkage k0=10, min-max rescaled into the cluster''s existing cell
  range) iff the cluster holds >= 20 usable coding prompts with variance; otherwise the v0.80 knowledge
  cell is kept byte-identical. Result: 3 coding cells, 13 knowledge cells. Config: per-cluster-knapsack
  (DP optimum: max replay accuracy s.t. cost<=$0.60/1k) — replay 68.54% @ $0.56/1k, coding replay 68.77%.
  centroids.bin, model_axes.json and model_registry.json are BYTE-IDENTICAL to v0.80; quality_means.json
  and model_features.json carry the mixed cells (psi_probe mirrors quality_means — model_features overrides
  it at load time); rankings.json regenerated via the exact runtime blend (parity-gated on v0.80 first).
  alpha_floor clamped to never exceed the new default alpha.


  v0.80 = v0.79 with default_routing_knobs retuned from the RouterArena sub_10 measured labels (ticket
  #75; scripts/build_v080_cost_retune.py). Config: per-cluster-knapsack (DP optimum: max replay accuracy
  s.t. cost<=$0.60/1k) — replay (cluster-size-weighted winner accuracy / avg_cost) 70.02% @ $0.52/1k (per-prompt
  aggregation 70.20% @ $0.52/1k) vs v0.79''s 70.58% @ $1.18/1k (70.75% @ $1.12/1k per-prompt). Ticket
  bar (acc>=69.0%, cost<=$0.60/1k): MET. Winner changes vs v0.79: 4/16 clusters (c1: qwen3.8-27b -> deepseek-v4-flash
  (n=10); c3: deepseek-v4.1-flash -> deepseek-v4-flash (n=3); c6: deepseek-v4.1-flash -> deepseek-v4-flash
  (n=5); c10: qwen3.8-27b -> deepseek-v4-flash (n=196)). The ticket''s <0.02-z tie criterion is vacuous
  on the measured cells (minimum cluster quality-cell spread is 0.81 z, an order of magnitude above the
  0.02 threshold), so the per-cluster tie variant degenerates to the uniform grid; the retune instead
  lands on the per-cluster knapsack optimum — each cluster''s alpha is the midpoint of the blend interval
  where its measured-Pareto-best lane wins, chosen by DP to maximize replay accuracy under the $0.60/1k
  budget. The premium lanes keep the clusters where their measured margin earns their price (c0, c14:
  qwen3.8-27b) and lose the ones where it does not (c1 dominated by the flash lane; c10''s 2.4pt margin
  does not earn its $2.72/1k measured burn on 196 prompts). centroids.bin, quality_means.json, model_axes.json,
  model_registry.json and model_features.json are BYTE-IDENTICAL to v0.79 (pure knob retune — no new inference,
  no geometry change). rankings.json regenerated over the 8-model roster with the new knobs via the exact
  runtime blend (parity-gated on v0.79 first). alpha_floor clamped to never exceed the new default alpha
  per cluster.


  v0.79 = v0.78 with the 8 AIand quality columns MEASURED from the RouterArena campaign (sub_10 split,
  real ground-truth grading via RouterArena''s own evaluators; scripts/build_v079_aiand_measured.py).
  Pipeline: embed prompts with the runtime contract (jina-v2-base-code-int8), assign clusters by centroid
  argmax (frozen geometry), per-prompt z-score across the 8 model columns, per-(cluster, model) shrunk
  means (shrinkage_k0=10), min-max rescaled into each cluster''s existing range. model_axes verbosity
  from measured output tokens. centroids BYTE-IDENTICAL. rankings regenerated (parity-gated on v0.78 first).
  Measured cells replace v0.78''s researched anchors — the comparison report is in the parent issue.


  v0.78 = v0.77 narrowed to the 8-model curated AIand roster (user decision 2026-10-04; dropped glm-5.2,
  kimi-k2.7-code, qwen3.6-27b, gemma-4, gpt-oss-120b). The REGISTRY is the enforcement surface — boot
  registers all providers regardless of wired keys, so an 8-model model_registry.json is what restricts
  routing; no env pin or BYOK header can widen it. quality_means/model_axes columns keep all 31 v0.77
  entries (loader validates registry candidates only); rankings regenerated over the 8 by the exact runtime
  blend (parity-gated on v0.77''s committed rankings first). centroids.bin BYTE-IDENTICAL to v0.75/v0.76/v0.77.
  Family note: deepseek-v4-flash + v4.1-flash share a family key but are distinct capability variants
  (text-only vs multimodal) — exempted, not a supersession. Cells inherit v0.77''s researched anchoring;
  v0.79 replaces them with measured labels (RouterArena full-split campaign). Candidate; promotion handled
  with the family-gate exemption in the same ticket series.


  v0.77 = v0.76 with the 13 AIand quality columns RE-ANCHORED on researched benchmarks (additive overlay;
  no model retired; centroids.bin BYTE-IDENTICAL to v0.75/v0.76). Calibration: per-cluster least-squares
  regression from AA Intelligence Index v4.3.2 (2026-10-04, max/reasoning variant) to the frozen q_norm
  cell, fit over the 18 v0.75 roster anchors (AA 9-51, interpolation range), blended 50/50 with SWE-bench
  Verified (independent Vals runs) where both exist, slope floored at 0, clamped to the cluster''s [min,max].
  Key corrections vs v0.76 guesses: glm-5.3-flash 0.85x glm-5.2 -> AA 42 vs 34, SWE-V 92.0 vs 82.8 (near-frontier
  at flash price); kimi-k3 1.05x k2.7 -> AA 44 vs 26, SWE-V 93.4 vs 78.2; glm-5.3 clone glm-5.2 -> AA
  45 vs 34, SWE-V 95.4 vs 82.8; gemma-4/gpt-oss scaled 0.85/0.88 -> AA 15/12 (weak coders, cheap+fast
  lanes); qwen3.6 0.92x -> AA 21. model_axes TTFT/TPS replaced with AA-published per-model medians where
  available (v0.76 cloned the source model''s axes). rankings.json regenerated by the exact runtime blend
  (parity-gated on v0.76 first). Generated by scripts/build_v077_aiand_researched.py from .context/bench-scores.md
  + .context/roster-aa-indexes.md sources. Candidate; artifacts/latest NOT bumped.


  v0.76 = v0.75 with the 13-model AIand roster ADDED (additive overlay; no model retired). centroids.bin
  BYTE-IDENTICAL to v0.75 (no retrain, no re-cluster; K=16 geometry frozen). Each AIand model''s quality_means
  column is a clone of the semantically nearest existing column, scaled and clamped to the cluster''s
  existing [min,max]: zai-org/glm-5.2=z-ai/glm-5.2; zai-org/glm-5.3=z-ai/glm-5.2; zai-org/glm-5.3-flash=z-ai/glm-5.2×0.85;
  deepseek-ai/deepseek-v4-flash=deepseek/deepseek-v4-flash; deepseek-ai/deepseek-v4.1-flash=deepseek/deepseek-v4-flash;
  deepseek-ai/deepseek-v4-pro=deepseek/deepseek-v4-pro; moonshotai/kimi-k2.7-code=moonshotai/kimi-k2.7;
  moonshotai/kimi-k3=moonshotai/kimi-k2.7×1.05; qwen/qwen3.6-27b=qwen/qwen3-coder-next×0.92; qwen/qwen3.8-27b=qwen/qwen3-coder-next×0.95;
  motif-technologies/motif-3=qwen/qwen3-coder-next×0.88; google/gemma-4-31b-it=qwen/qwen3-next-80b-a3b-instruct×0.85;
  openai/gpt-oss-120b=qwen/qwen3-next-80b-a3b-instruct×0.88. model_axes rows carry live-probed AIand catalog
  input/output prices (GET /v1/models, 2026-10-04); TTFT/TPS/verbosity are cloned from the source model''s
  axes row, pending live measurement. rankings.json regenerated by the exact runtime blend (uniform alpha=0.96,
  speed_weight=0, output_cost_ratio=0) over the 31-model roster — parity-gated: the same blend reproduces
  v0.75''s committed rankings bit-for-bit on the unchanged 18-model roster first. The default roster keeps
  all 18 v0.75 models so non-AIand deploys are unaffected on bump; AIand-only deploys narrow via availableProviders
  at boot (only AIAND_API_KEY wired -> filterByProviders keeps the provider:"aiand" entries). Generated
  by scripts/build_v076_aiand_roster.py. Candidate; artifacts/latest NOT bumped (promotion is a separate
  deliberate step).


  v0.75 = v0.73 with claude-opus-4-8 retired and claude-opus-5 added in its place (routing-roster swap;
  same $5/$25 price). centroids.bin BYTE-IDENTICAL to v0.73 (no retrain, no re-cluster). claude-opus-5''s
  quality_means column is a manual clone of claude-fable-5''s per-cluster cells (per direction "make opus
  5 similar to fable"), priced at opus-5''s real catalog rate (0.005/0.025 per 1k), NOT fable''s ($10/$50).
  rankings.json regenerated by the exact runtime blend over the new 18-model roster (parity-gated: the
  same blend reproduces v0.73 bit-for-bit on the unchanged roster first). No probe run and no bake-off
  (explicit direction). Candidate; latest bump is a separate step.


  v0.70 = v0.68 with four new models added on FROZEN v0.68 geometry (z-ai/glm-5.2, minimax/minimax-m3,
  moonshotai/kimi-k2.7, qwen/qwen3.7-plus). centroids.bin is BYTE-IDENTICAL to v0.68 (no retrain, no re-cluster):
  v0.68''s training corpus is no longer reproducible (OpenRouterBench source returns 0 rows, routerarena
  label file drifted), so retraining would churn the geometry (the rejected v0.69 path regressed hard-agentic
  solve ~13pt purely from cluster movement). Instead this is a geometry-frozen ADDITIVE OVERLAY (scripts/build_v079_additive_overlay.py):
  each new model is calibrated onto v0.68''s per-cluster q_norm scale via existing models'' shared v0.68-geometry
  DeepSWE solve rates (eval/deepswe_quality_priors_v0.68.json) as anchors (np.interp, clamped so a new
  model can at most tie the best existing coder, never extrapolate), blended with cost and APPENDED to
  the 11 coding clusters; qwen3.7-plus has no DeepSWE signal so it proxies qwen3-coder-next''s q_norm
  (v0.78 pattern). Conversational clusters (2,9,10,11,15) get no new-model entry -> byte-identical routing
  there. Net vs v0.68: 14/16 cluster top-1 winners UNCHANGED; only c8 and c14 flip opus-4-8 -> glm-5.2.
  minimax-m3 / kimi-k2.7 / qwen3.7-plus win no clusters (inert). quality_means carries the new columns
  (q_norm mapped onto each cluster''s existing [min,max]) so UI-alpha re-blends stay consistent. Anchor
  calibration mean r=+0.48 (c8 r=0.58 solid; c14 r=0.19 sparse). Candidate; promote gates on cmd/routing-report
  + live bake-off. Inherited v0.68 behavior below: v0.68 = v0.67 with a per-cluster alpha demote on the
  conversational/NL clusters. Pure metadata delta: centroids.bin, quality_means.json, model_features.json,
  model_axes.json, model_registry.json and rankings.json are all BYTE-IDENTICAL to v0.67 (no retrain,
  no re-cluster). The only change is default_routing_knobs.alpha: clusters 2, 9, 10, 11, 15 drop 0.96
  -> 0.80; all other clusters stay 0.96. Motivation: at the deployed uniform alpha=0.96 the cost term
  carries only 4% of the blend, so conversational / trivial-NL turns route to Opus ~70-80% of the time
  even though every model handles them comparably (low per-cluster quality dispersion, Opus margin <0.02
  z). The five demoted clusters are the NL/trivial-dominant clusters identified by the labeled register-probe
  corpus (testdata/register_probes.jsonl, 180 prompts x 6 registers); coding/agentic clusters (0, 5, 13,
  ...) are left at 0.96 so Opus is retained where it earns a real margin. Offline replay over the corpus
  (cmd/routing-report) at top_p=2: conversational premium share 80% -> 43%, trivial-NL 90% -> 53%, with
  hard-code (80%/100%) and agentic-tool (93%/100%) UNCHANGED. NL traffic lands mostly on deepseek-v4-pro.
  The offline quality axis is the router''s own quality_means, not ground-truth solve rate -- the model
  mix is exact, the quality estimate is a proxy. Candidate only; promote gated on a live bake-off and
  the cmd/routing-report sign-off on the latest-bump PR.'
