version: "2"

run:
  tests: true

linters:
  default: none
  enable:
    - depguard
    - contextcheck
    - dupl
    - errorlint
    - forcetypeassert
    - testifylint
    - unparam
    - errcheck
    - bodyclose
    - nilerr
    - exhaustive
    - gosec
    - noctx
    - thelper
    - ineffassign
    - staticcheck
    - unused
    - wastedassign
  settings:
    testifylint:
      enable-all: true
      disable:
        # translate tests assert byte-exact JSON output; JSONEq would hide key order and whitespace changes.
        - encoded-compare
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1020
        - -ST1021
        - -ST1022
    errcheck:
      exclude-functions:
        - (*bufio.Writer).WriteString
        - (*bufio.Writer).WriteByte
        - (*bufio.Writer).WriteRune
        - (*bufio.Writer).Write
        - (*strings.Builder).WriteString
        - (*strings.Builder).WriteByte
        - (*bytes.Buffer).WriteString
    dupl:
      threshold: 100
    gosec:
      excludes:
        - G115
        - G101
        - G117
        - G704
        - G304
        - G104
        - G703
        - G705
        - G204
        - G702
    errorlint:
      comparison: true
      asserts: true
      errorf: false
    exhaustive:
      default-signifies-exhaustive: true
    depguard:
      rules:
        leaf:
          files:
            - "**/internal/config/**"
            - "**/internal/observability/*.go"
            - "!**/*_test.go"
          deny:
            - pkg: aiand-os/router/internal
              desc: leaf utilities cannot import internal packages
        presentation:
          files:
            - "**/internal/api/**"
            - "**/internal/server/**"
            - "!**/*_test.go"
          deny:
            - pkg: aiand-os/router/internal/postgres
            - pkg: aiand-os/router/internal/sqlc
            - pkg: aiand-os/router/internal/translate
            - pkg: aiand-os/router/internal/providers/
            - pkg: github.com/jackc/pgx
        pgx-only-postgres:
          files:
            - "**/internal/**"
            - "!**/internal/postgres/**"
            - "!**/internal/sqlc/**"
            - "!**/*_test.go"
          deny:
            - pkg: github.com/jackc/pgx
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - dupl
      # Cloud SQL certificates cannot pass hostname verification; VerifyConnection checks the CA chain and identity instead.
      - path: internal/postgres/pgtls/pgtls\.go
        linters:
          - gosec
        text: G402
      # Read by other containers or executed as a stub binary.
      - path: (internal/policyregistry/directory\.go|smoke/mitmproxy/(main|store)\.go|scripts/subscription_enrollment_check/enrollment_test\.go)
        linters:
          - gosec
        text: G30[126]
      # Seeded math/rand is the fixture: the Monte-Carlo propensity estimate and
      # the benchmark's unit vectors must be reproducible across runs.
      - path: (internal/router/bandit/bandit_test\.go|internal/router/cluster/route_benchmark_test\.go)
        linters:
          - gosec
        text: G404

issues:
  # Duplicate-code findings apply to new code only; existing clones are tracked for removal.
  new-from-merge-base: origin/main
